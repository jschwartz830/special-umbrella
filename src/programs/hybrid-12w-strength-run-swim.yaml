schemaVersion: 1
name: "Hybrid 12-Week: Strength, Run, Swim & Mobility"
description: >
  Three home lifts (squat / deadlift / accessories optional) plus a Saturday
  gym machine session and swim, three easy runs building to a 42-minute long
  run, and Tue/Thu mobility for ankle, hips, T-spine and scapular control.
  Weeks follow the calendar: a missed session carries to the next day within
  the week, and each Monday starts the new week fresh (nothing doubles up).
  Pause a week for travel from Today. Saturday's gym session (machines +
  swim) is suggested Sat/Sun only, but you can pick it any day from "This
  week". Weeks 4, 8 and 12 are deloads (fewer sets, same weights, no
  increases). Barbell and home dumbbell lifts add 5 lb
  once every working set hits the top of the range; machines you bump yourself.

duration:
  type: weeks
  value: 12

weekly: true

schedule:
  run_tue: [10, 12, 12, 10, 15, 15, 18, 12, 18, 20, 20, 15]
  run_thu: [8, 10, 15, 12, 18, 20, 20, 17, 22, 23, 25, 20]
  run_sun: [20, 22, 25, 20, 28, 30, 33, 25, 35, 38, 42, 32]
  thu_opt: ["Optional ", "Optional ", "", "", "", "", "", "", "", "", "", ""]
  thu_note: ["Optional this week — skip freely. ", "Optional this week — skip freely. ", "", "", "", "", "", "", "", "", "", ""]
  swim_yd: ["600", "600", "700", "500", "800", "900", "1,000", "700", "1,100", "1,200", "1,400", "900"]
  swim_main: ["4 × 50", "4 × 50", "6 × 50", "2 × 50", "4 × 100", "5 × 100", "6 × 100", "3 × 100", "3 × 100 + 2 × 200", "4 × 100 + 2 × 200", "4 × 100 + 3 × 200", "5 × 100"]

deload:
  weeks: [4, 8, 12]
  setsMultiplier: 0.6

vars:
  squat: 155
  bench: 85
  db_row: 30
  db_lunge: 15
  deadlift: 185
  landmine: 45
  db_split: 15

days:
  - label: "Mon — Strength A"
    slots:
      - type: weights
        name: "Strength A — Squat"
        focus: full_body
        intent: hypertrophy
        location: home
        durationMin: 45
        notes: "Machine/DB loads: 2-4 reps in reserve. Short on time: squat, bench, row only."
        exercises:
          - { exercise: "Squat, Barbell", sets: 3, reps: "6-8", load: squat, rest: 2.5m, progressionType: double, progress: { if: all_reps, then: "squat += 5" } }
          - { exercise: "Bench Press, Barbell", sets: 2, reps: "8-10", load: bench, rest: 105s, progressionType: double, notes: "Stop if shoulder/scap control slips", progress: { if: all_reps, then: "bench += 5" } }
          - { exercise: "Incline Row, Dumbbell", sets: 3, reps: "8-12", load: db_row, rest: 80s, progressionType: double, notes: "Chest-supported; weight per hand", progress: { if: all_reps, then: "db_row += 5" } }
          - { exercise: "Reverse Lunge, Dumbbell", sets: 2, reps: 8, load: db_lunge, rest: 75s, notes: "Reps per leg; weight per hand", progress: { if: all_reps, then: "db_lunge += 5" } }
          - { exercise: "Single-Leg Standing Calf Raise", sets: 2, reps: "10-12", rest: 50s, progressionType: double, notes: "Reps per leg; slow lowering" }
          - { exercise: "Bear Plank Scap Push-Up Plus", sets: 3, reps: 8, rest: 45s, notes: "PT scapular exercise — use your prescribed dose" }

  - label: "Tue — Easy Run + Mobility"
    slots:
      - type: run
        name: "Easy Run — {run_tue} min"
        subtype: easy
        difficulty: easy
        location: home
        notes: "Treadmill, conversational. Missed? Just do the next session — don't add the minutes elsewhere."
        segments:
          - { type: easy, duration: "{run_tue}m", pace: easy, notes: "Conversational effort; run/walk is fine" }
      - type: mobility
        name: "Mobility + Ankle/Scap"
        intent: recovery_mobility
        location: home
        durationMin: 10
        mobilityExercises:
          - { id: lib-ankle-dorsiflexion-wall, name: "Knee-to-Wall Ankle Rocks", sets: [{ reps: 8 }, { reps: 8 }], notes: "One set per side" }
          - { id: lib-thoracic-rotation, name: "Thoracic Rotations", sets: [{ reps: 6 }, { reps: 6 }], notes: "One set per side" }
          - { id: hip-flexor-stretch, name: "Half-Kneeling Hip Flexor Stretch", sets: [{ duration: 30s }, { duration: 30s }], notes: "One set per side" }
          - { id: lib-single-leg-balance, name: "Single-Leg Balance", sets: [{ duration: 30s }, { duration: 30s }], notes: "One set per side" }
          - { id: lib-bear-plank-scap-pushup-plus, name: "Scapular PT Exercise", sets: [{ reps: 8 }, { reps: 8 }, { reps: 8 }], notes: "Use your PT's prescribed exercise and dose" }

  - label: "Wed — Strength B"
    slots:
      - type: weights
        name: "Strength B — Deadlift"
        focus: full_body
        intent: hypertrophy
        location: home
        durationMin: 50
        notes: "Short on time: deadlift, pull-ups, landmine press only."
        exercises:
          - { exercise: "Deadlift, Barbell", sets: 2, reps: 5, load: deadlift, rest: 2.75m, progress: { if: all_reps, then: "deadlift += 5" } }
          - { exercise: "Pull Up, Band", sets: 3, reps: "4-6", rest: 90s, progressionType: double, notes: "Assisted; reduce band assistance over time" }
          - { exercise: "Half-Kneeling Landmine Press", sets: 2, reps: 8, load: landmine, rest: 75s, notes: "Reps per side; start with the empty bar", progress: { if: all_reps, then: "landmine += 5" } }
          - { exercise: "Split Squat, Dumbbell", sets: 2, reps: 8, load: db_split, rest: 75s, notes: "Reps per leg; weight per hand", progress: { if: all_reps, then: "db_split += 5" } }
          - { exercise: "Nordic Curl (Assisted)", sets: 2, reps: "3-5", rest: 90s, progressionType: double }
          - { exercise: "Bent-Knee Single-Leg Calf Raise", sets: 2, reps: 12, rest: 50s, notes: "Reps per leg (soleus)" }
          - { exercise: "Dead Bug", sets: 2, reps: 8, rest: 45s, notes: "Reps per side; or plank 30-45s" }

  - label: "Thu — Easy Run + Mobility"
    slots:
      - type: run
        name: "{thu_opt}Easy Run — {run_thu} min"
        subtype: easy
        difficulty: easy
        location: home
        notes: "{thu_note}Conversational effort."
        segments:
          - { type: easy, duration: "{run_thu}m", pace: easy, notes: "Conversational effort; run/walk is fine" }
      - type: mobility
        name: "Mobility + Ankle/Scap"
        intent: recovery_mobility
        location: home
        durationMin: 10
        mobilityExercises:
          - { id: lib-ankle-dorsiflexion-wall, name: "Knee-to-Wall Ankle Rocks", sets: [{ reps: 8 }, { reps: 8 }], notes: "One set per side" }
          - { id: lib-thoracic-rotation, name: "Thoracic Rotations", sets: [{ reps: 6 }, { reps: 6 }], notes: "One set per side" }
          - { id: hip-flexor-stretch, name: "Half-Kneeling Hip Flexor Stretch", sets: [{ duration: 30s }, { duration: 30s }], notes: "One set per side" }
          - { id: lib-single-leg-balance, name: "Single-Leg Balance", sets: [{ duration: 30s }, { duration: 30s }], notes: "One set per side" }
          - { id: lib-bear-plank-scap-pushup-plus, name: "Scapular PT Exercise", sets: [{ reps: 8 }, { reps: 8 }, { reps: 8 }], notes: "Use your PT's prescribed exercise and dose" }

  - label: "Fri — Strength D (Optional)"
    optional: true
    slots:
      - type: weights
        name: "Strength D — Accessories (Optional)"
        focus: upper
        intent: hypertrophy
        location: home
        durationMin: 25
        notes: "Optional — skip freely; this week still counts with 3 lifts."
        exercises:
          - { exercise: "Incline Bench Press, Dumbbell", sets: 2, reps: "10-12", rest: 75s, progressionType: double }
          - { exercise: "Bent Over One Arm Row, Dumbbell", sets: 2, reps: 10, rest: 60s, notes: "Reps per side" }
          - { exercise: "Lateral Raise, Dumbbell", sets: 2, reps: 15, rest: 45s }
          - { exercise: "Hammer Curl, Dumbbell", sets: 2, reps: "10-12", rest: 60s, progressionType: double }
          - { exercise: "Triceps Extension, Dumbbell", sets: 2, reps: 12, rest: 60s, notes: "Or cable pushdown" }

  - label: "Sat — Strength C + Swim"
    allowedDays: [sat, sun]
    slots:
      - type: weights
        name: "Strength C — Machines"
        focus: full_body
        intent: hypertrophy
        location: gym
        durationMin: 60
        notes: "Start machines at a comfortable effort, 2-4 reps in reserve. Short on time: chest press, row, leg press, pulldown."
        exercises:
          - { exercise: "Chest Press, Leverage Machine", sets: 2, reps: "8-12", rest: 90s, progressionType: double }
          - { exercise: "Seated Row, Cable", sets: 3, reps: "10-12", rest: 75s, progressionType: double }
          - { exercise: "Leg Press, Leverage Machine", sets: 2, reps: "10-12", rest: 90s, progressionType: double }
          - { exercise: "Lat Pulldown, Cable", sets: 2, reps: "10-12", rest: 75s, progressionType: double, notes: "Neutral grip" }
          - { exercise: "Lateral Raise, Dumbbell", sets: 2, reps: "12-15", rest: 60s, progressionType: double }
          - { exercise: "Seated Leg Curl, Leverage Machine", sets: 2, reps: "10-12", rest: 75s, progressionType: double }
          - { exercise: "Seated Calf Raise, Leverage Machine", sets: 2, reps: "12-15", rest: 60s, progressionType: double }
          - { exercise: "Crunch, Cable", sets: 2, reps: "12-15", rest: 60s, progressionType: double }
      - type: swim
        name: "Swim — {swim_yd} yd"
        subtype: technique
        difficulty: easy
        location: gym
        durationMin: 30
        notes: "Gym session — suggested Sat/Sun; pick it from This week to do it another day. {swim_yd} yd total, freestyle. 200 warm-up; 4 × 25 drills (catch-up, fingertip drag, side kick) with 20s rest; main {swim_main} with 20-30s rest (45s after 200s); 100 cool-down. App logs meters: enter yards × 0.914, or note yards."

  - label: "Sun — Long Run + Yoga"
    slots:
      - type: run
        name: "Long Easy Run — {run_sun} min"
        subtype: long
        difficulty: easy
        location: outdoor
        notes: "Conversational effort; run/walk is fine. Outdoors or treadmill."
        segments:
          - { type: easy, duration: "{run_sun}m", pace: easy, notes: "Conversational effort; run/walk is fine" }
      - type: yoga
        name: "Yoga Class"
        subtype: mobility
        difficulty: easy
        location: class
        durationMin: 60
        notes: "Weekly class — log as completed or skip. Missed Saturday's swim? Do it here at the gym before or after class."
