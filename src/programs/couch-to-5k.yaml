schemaVersion: 1
name: "Couch to 5K"
description: >
  The classic 9-week beginner running plan: three runs a week, alternating
  jogging and walking, building to 30 minutes of continuous running. Run at
  a pace where you could hold a conversation. It's fine to repeat a week
  before moving on.

duration:
  type: rotations
  value: 1

days:
  - label: "Week 1 · Run 1"
    slots:
      - type: run
        name: "C25K W1R1 — 8 × 1m jog / 90s walk"
        subtype: intervals
        difficulty: easy
        durationMin: 30
        segments:
          - type: warmup
            duration: 5m
            pace: walk
            notes: "Brisk walk"
          - type: interval
            duration: 1m
            pace: easy
            reps: 8
            rest: 90s
            notes: "Jog; walk during rest"
          - type: cooldown
            duration: 5m
            pace: walk

  - label: "Week 1 · Run 2"
